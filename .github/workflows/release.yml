name: release

# Packs the tools, checks the package on Linux, macOS and Windows, and
# publishes it with a release.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in package.json has no tag yet, this workflow packs the tools from
# that commit and checks the package on every system, then tags the commit
# and publishes the release with the package attached. Nothing goes public
# unless every check passes.
#
# It also attaches the package to a release someone publishes by hand, and it
# can be run by hand to rebuild the package of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(node -p 'require("./package.json").version')
            if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"; then
              echo "package.json has no version of the form X.Y.Z: $version" >&2
              exit 1
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  pack:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - run: sh scripts/package.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: keyvaluestore-tools
          path: dist/

  check:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20"
          - os: ubuntu-24.04-arm
            node: "24"
          - os: macos-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    steps:
      # The smoke test comes from the same commit; the tools come only from
      # the package, so what's checked is what ships.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          path: src
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: keyvaluestore-tools
          path: dist
      - name: Unpack the tar.gz
        if: runner.os != 'Windows'
        run: mkdir tgz && tar -xzf dist/keyvaluestore-tools.tar.gz -C tgz
      - name: Check the tar.gz
        if: runner.os != 'Windows'
        run: node src/scripts/smoke.js tgz/keyvaluestore-tools
      - name: Unpack the zip
        shell: pwsh
        run: Expand-Archive dist/keyvaluestore-tools.zip -DestinationPath zip
      - name: Check the zip
        run: node src/scripts/smoke.js zip/keyvaluestore-tools

  release:
    needs: [plan, pack, check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: keyvaluestore-tools
          path: dist
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum keyvaluestore-tools.tar.gz keyvaluestore-tools.zip > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          All the KeyValueStore.com tools in one package: each tool's library, command line, web page and manual, with the license files. They run anywhere Node.js 20 or newer runs, with nothing to install and nothing to build.

          | File | For |
          |---|---|
          | keyvaluestore-tools.tar.gz | Linux and macOS |
          | keyvaluestore-tools.zip | Windows, or anywhere zip is handier |

          Unpack it and run a tool, such as `node keyvaluestore-tools/slots/cli.js --help`, or open a tool's `app/index.html` in a browser. Every tool is also on the web at https://keyvaluestore.com/tools/.

          SHA256SUMS lists the checksums. The tests and the data they replay aren't in the package; they're in the repository.
          EOF
      - name: Tag the commit and publish the release, package attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "KeyValueStore Tools $TAG" --notes-file ../notes.md \
            keyvaluestore-tools.tar.gz keyvaluestore-tools.zip SHA256SUMS
      - name: Attach the package to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            keyvaluestore-tools.tar.gz keyvaluestore-tools.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
